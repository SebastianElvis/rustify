# Confidence: lower than source-based grades. No source exists.
# The features come from the manual page, the usage text, the binary strings, and observed behavior.
# The components come from the evaluator's own reverse engineering: Objective-C class and selector names
# that `strings`, `nm`, and `otool -ov` show in /usr/bin/iconutil (macOS build 25G325).
scope: the complete iconutil command on macOS arm64 in the C locale
features:
- id: usage
  pattern: (?i)usage|--help|-h\b
- id: convert-option
  pattern: --convert|-c (icns|iconset)
- id: output-option
  pattern: --output|-o\b
- id: default-output
  pattern: (?i)default (output|name|file)|same (directory|folder)
- id: iconset-to-icns
  pattern: (?i)iconset\W+(to|into|->)\W+\.?icns|-c icns
- id: icns-to-iconset
  pattern: (?i)icns\W+(to|into|->)\W+\.?iconset|-c iconset
- id: icon-sizes
  pattern: (?i)@2x|512x512|1024|scale
- id: image-validation
  pattern: (?i)dimension|wrong size|pixel size|invalid (image|png)|corrupt
- id: png-formats
  pattern: (?i)\bpng\b
- id: legacy-entries
  pattern: (?i)is32|il32|it32|ICN#|icl8|legacy|ARGB|packbits|run-length
- id: asset-catalog
  pattern: (?i)\.car\b|asset catalog
- id: icon-name
  pattern: (?i)icon[- ]name
- id: errors
  pattern: (?i)error message|exit (status|code)|not found|Failed to
- id: separate-hidpi
  pattern: ICONCOMPILER_SEPARATE_HIDPI|@2x\.icns
- id: base-system-icns
  pattern: ICONCOMPILER_GENERATE_BASE_SYSTEM_ICNS|\.licns
components:
- id: command-line
  pattern: (?i)getopt|option pars|argument pars|command line
- id: icns-container
  pattern: ISIcns|icnsWithType|writeAsICNSToURL|(?i)icns (writer|encoder|container)
- id: iconset-reader
  pattern: ISIconset|iconsetWithURL|(?i)iconset (reader|loader|parser)
- id: iconset-writer
  pattern: writeAsIconsetToURL|(?i)iconset writer
- id: asset-catalog-reader
  pattern: ISAssetCatalogResource|assetCatalogResourceWithURL|(?i)(asset catalog|car) (reader|parser|resource)
- id: compositor
  pattern: ISCompositor|(?i)composit|render
- id: recipe
  pattern: ISGenericRecipe|ISiOSMacAppRecipe|addElementWithRecipe|(?i)recipe
- id: icon-specification
  pattern: IFIconSpecification|macosIconSpecification|allImageSpecifications|(?i)icon specification|size table
- id: image-codec
  pattern: (?i)png (encoder|decoder|codec)|ImageIO|deflate|zlib
- id: run-length-codec
  pattern: (?i)packbits|run-length|\brle\b
- id: keyed-archive
  pattern: (?i)NSKeyedArchiver|bplist|keyed archive|info (entry|plist)
- id: environment-flags
  pattern: getenv|ICONCOMPILER_
- id: file-system
  pattern: NSFileManager|fileExistsAtPath|(?i)file system|file manager
