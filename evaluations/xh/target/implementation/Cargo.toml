[package]
name = "rustify-xh"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "xh"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt"] }
