features:
- id: hash-files
  pattern: (?i)file
- id: stdin
  pattern: (?i)standard input|stdin
- id: raw
  pattern: --raw
- id: length
  pattern: --length
- id: seek
  pattern: --seek
- id: keyed
  pattern: --keyed
- id: derive-key
  pattern: --derive-key
- id: check
  pattern: --check
- id: no-names
  pattern: --no-names
- id: quiet
  pattern: --quiet
- id: tag
  pattern: --tag
components:
- id: argument-parser
  pattern: (?i)argument|option pars|clap
- id: hasher
  pattern: (?i)hash_path|hasher|digest
- id: output-writer
  pattern: (?i)hex output|output writer|write_hex
- id: checkfile
  pattern: (?i)check ?file|check_one
- id: parallel-hashing
  pattern: (?i)rayon|parallel|thread|mmap
