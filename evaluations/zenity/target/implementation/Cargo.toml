[package]
name = "zenity"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSApplication", "NSAlert", "NSButton", "NSControl", "NSTextField", "NSView", "NSWindow", "NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSGeometry", "NSObject"] }
